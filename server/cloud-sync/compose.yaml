services:
  api:
    build: .
    restart: unless-stopped
    env_file: ${INKCLOUD_ENV_FILE:?Provide an environment file outside the checkout}
    ports:
      - "127.0.0.1:18761:8000"
    volumes:
      - inkcloud-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
volumes:
  inkcloud-data:
