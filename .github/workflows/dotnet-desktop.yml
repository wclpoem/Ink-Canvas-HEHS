name: build

# 自动构建已按用户决策关闭（2026-11-19）——仅保留手动触发。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The solution declares only x64; omitting the platform fails with MSB4126.
      - name: Restore
        run: dotnet restore InkCanvas.slnx -p:Platform=x64

      - name: Build
        run: dotnet build InkCanvas.slnx -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test tests/InkCanvas.Core.Tests/InkCanvas.Core.Tests.csproj -c Release -p:Platform=x64 --no-build

      - name: Test legacy import plugin
        run: dotnet test tests/InkCanvas.LegacyImport.Tests/InkCanvas.LegacyImport.Tests.csproj -c Release -p:Platform=x64 --no-build

      - name: Test AI assistant
        run: dotnet test tests/InkCanvas.Ai.Tests/InkCanvas.Ai.Tests.csproj -c Release -p:Platform=x64 --no-build

      - name: Test PowerPoint integration
        run: dotnet test tests/InkCanvas.P0.Tests/InkCanvas.P0.Tests.csproj -c Release -p:Platform=x64 --no-build

      - name: Test classroom tools
        run: dotnet test tests/InkCanvas.Classroom.Tests/InkCanvas.Classroom.Tests.csproj -c Release -p:Platform=x64 --no-build

      - name: Test time machine plugin
        run: dotnet test tests/InkCanvas.TimeMachine.Tests/InkCanvas.TimeMachine.Tests.csproj -c Release -p:Platform=x64 --no-build

      - name: Publish
        run: dotnet publish src/InkCanvas.App/InkCanvas.App.csproj -c Release -p:Platform=x64 -o artifacts/app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: InkCanvas-winui3-x64
          path: artifacts/app
